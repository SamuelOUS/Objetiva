name: Production

on:
  push:
    branches:
      - main

jobs:
  production:

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://objetiva:objetiva@localhost:5434/objetiva_prod?schema=public
      NODE_ENV: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de produccion
        run: docker compose -f docker-compose.prod.yml build

      - name: Levantar PostgreSQL y API
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Esperar PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.prod.yml exec -T postgres-prod pg_isready -U objetiva -d objetiva_prod; then
              echo "PostgreSQL esta listo"
              break
            fi

            echo "Esperando PostgreSQL..."
            sleep 2
          done

      - name: Ejecutar migraciones
        run: docker compose -f docker-compose.prod.yml exec -T api-prod npx prisma migrate deploy

      - name: Verificar API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3002; then
              echo ""
              echo "API de produccion disponible"
              break
            fi

            echo "Esperando API..."
            sleep 2
          done

      - name: Mostrar logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Detener contenedores
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v