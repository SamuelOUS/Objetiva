name: Tests

on:
  push:
    branches:
      - feature/tests
  pull_request:
    branches:
      - feature/tests

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: objetiva
          POSTGRES_PASSWORD: objetiva
          POSTGRES_DB: objetiva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U objetiva -d objetiva_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://objetiva:objetiva@localhost:5432/objetiva_test?schema=public
      NODE_ENV: test

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar migraciones
        run: npx prisma migrate deploy

      - name: Ejecutar pruebas
        run: npm test

      - name: Ejecutar cobertura
        run: npm run test:coverage
```
