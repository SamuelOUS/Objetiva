services:
  postgres-test:
    image: postgres:18
    container_name: objetiva-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: objetiva
      POSTGRES_PASSWORD: objetiva
      POSTGRES_DB: objetiva_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql

  api-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: objetiva-api-test
    depends_on:
      - postgres-test
    environment:
      DATABASE_URL: postgresql://objetiva:objetiva@postgres-test:5432/objetiva_test?schema=public
      NODE_ENV: test
    ports:
      - "3001:3000"

volumes:
  postgres_test_data: